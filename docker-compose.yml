services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/app.db
      - DATA_DIR=/app/data/documents
      - BASE_URL=http://localhost:3000
    restart: unless-stopped
